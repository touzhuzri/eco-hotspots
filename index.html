<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>天然产物 · 生态挂点</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 首屏加载：世界树生长 -->
  <div class="boot-loader" id="bootLoader" role="status" aria-live="polite">
    <div class="boot-inner">
      <div class="boot-tree" aria-hidden="true">
        <svg viewBox="0 0 120 160" class="boot-svg">
          <defs>
            <linearGradient id="bootTrunk" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#c9a227"/>
              <stop offset="100%" stop-color="#e8c56a"/>
            </linearGradient>
            <linearGradient id="bootLeaf" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#2d6b3a"/>
              <stop offset="100%" stop-color="#5ecf7a"/>
            </linearGradient>
          </defs>
          <!-- 土 -->
          <ellipse class="boot-soil" cx="60" cy="148" rx="42" ry="8" fill="#c9a227" opacity="0.35"/>
          <!-- 根 -->
          <path class="boot-root" d="M60 140 C48 136 36 142 28 148 M60 140 C72 136 84 142 92 148 M60 140 C54 144 48 150 44 156 M60 140 C66 144 72 150 76 156"
                fill="none" stroke="url(#bootTrunk)" stroke-width="2.2" stroke-linecap="round"/>
          <!-- 干 -->
          <path class="boot-trunk" d="M60 140 C58 110 62 90 60 55"
                fill="none" stroke="url(#bootTrunk)" stroke-width="3.2" stroke-linecap="round"/>
          <!-- 枝 -->
          <path class="boot-limb" d="M60 85 C48 78 40 70 34 58 M60 75 C72 68 80 60 86 48 M60 62 C50 56 44 48 40 40"
                fill="none" stroke="url(#bootTrunk)" stroke-width="2" stroke-linecap="round"/>
          <!-- 冠 -->
          <ellipse class="boot-crown" cx="60" cy="42" rx="36" ry="28" fill="url(#bootLeaf)" opacity="0.85"/>
          <ellipse class="boot-crown boot-crown2" cx="48" cy="48" rx="18" ry="14" fill="#3d8b4a" opacity="0.55"/>
          <ellipse class="boot-crown boot-crown3" cx="74" cy="50" rx="16" ry="12" fill="#3d8b4a" opacity="0.45"/>
        </svg>
      </div>
      <p class="boot-title">世界树正在生长中</p>
      <p class="boot-sub" id="bootStage">请等待…</p>
      <div class="boot-bar" aria-hidden="true">
        <div class="boot-bar-fill" id="bootBar"></div>
      </div>
      <p class="boot-pct" id="bootPct">0%</p>
    </div>
  </div>

  <!-- 竖屏手机：提示横屏（横屏布局≈桌面） -->
  <div class="rotate-gate" id="rotateGate" hidden>
    <div class="rotate-card">
      <div class="rotate-icon" aria-hidden="true"></div>
      <p class="rotate-title">请横屏浏览</p>
      <p class="rotate-sub">横屏后可获得与电脑一致的观察视角</p>
    </div>
  </div>
  <div class="app">
    <!-- UI 已收进场景右上角 ⚙；筛选可由设置或快捷键扩展 -->
    <header class="topbar topbar-hidden" hidden>
      <div class="filters" id="filters" role="group" aria-label="按生物类群筛选"></div>
      <p class="meta-note" id="metaNote"></p>
    </header>

    <main class="layout">
      <section class="scene-panel" aria-label="生态树场景">
        <div class="scene" id="scene"></div>
        <p class="scene-hint">拖拽旋转 · 滚轮/双指缩放 · 点击产物星</p>
      </section>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </main>

    <footer class="footer">
      <p id="footerNote"></p>
      <p style="margin-top:4px;opacity:.8">
        LOTUS（CC0）骨架 ·
        <a href="https://doi.org/10.7554/eLife.70780" target="_blank" rel="noopener">论文</a>
        · 非用药建议
      </p>
    </footer>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
