<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>天然产物 · 生态挂点</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="ui-intro">
  <!-- 首屏加载：世界树生长 -->
  <div class="boot-loader" id="bootLoader" role="status" aria-live="polite">
    <div class="boot-inner">
      <!-- 校徽：进入时圆形绽开，外圈同时作为加载进度环 -->
      <div class="boot-emblem">
        <span class="boot-halo" aria-hidden="true"></span>
        <svg class="boot-orbit" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="bootRingGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2fbf70"/>
              <stop offset="68%" stop-color="#7ad59a"/>
              <stop offset="100%" stop-color="#c9a227"/>
            </linearGradient>
          </defs>
          <!-- 二十四节气刻度：静态的「时间」；花瓣由 bootFlora 动态生成 -->
          <g id="bootSolarTerms"></g>
          <circle class="boot-ring-track" cx="120" cy="120" r="112"/>
          <circle class="boot-ring-progress" id="bootRing" cx="120" cy="120" r="112"/>
        </svg>
        <img class="boot-emblem-img" src="assets/hzau-emblem.png" alt="华中农业大学校徽" />
      </div>
      <p class="boot-title">世界树正在生长中</p>
      <p class="boot-sub" id="bootStage">请等待…</p>
      <div class="boot-bar" aria-hidden="true">
        <div class="boot-bar-fill" id="bootBar"></div>
      </div>
      <p class="boot-pct" id="bootPct">0%</p>
      <button type="button" class="boot-hint" id="bootFullscreen" title="也可以按 F11">
        <span class="boot-key">F11</span>
        <span class="boot-hint-text">进入全屏 · 视野更完整</span>
      </button>
    </div>
  </div>

  <!-- 竖屏手机：提示横屏（横屏布局≈桌面） -->
  <div class="rotate-gate" id="rotateGate" hidden>
    <div class="rotate-card">
      <div class="rotate-icon" aria-hidden="true"></div>
      <p class="rotate-title">请横屏浏览</p>
      <p class="rotate-sub">横屏后可获得与电脑一致的观察视角</p>
    </div>
  </div>
  <div class="app">
    <!-- UI 已收进场景右上角 ⚙；筛选可由设置或快捷键扩展 -->
    <header class="topbar topbar-hidden" hidden>
      <div class="filters" id="filters" role="group" aria-label="按生物类群筛选"></div>
      <p class="meta-note" id="metaNote"></p>
    </header>

    <main class="layout">
      <section class="scene-panel" aria-label="生态树场景">
        <div class="scene" id="scene"></div>
        <p class="scene-hint">拖拽旋转 · 滚轮/双指缩放 · 点击产物星</p>
      </section>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </main>

    <aside class="explore-rail" id="exploreRail" aria-label="探索导航"></aside>
    <div class="bottom-dock" id="bottomDock" aria-label="层位与视角"></div>
    <div class="idle-intro" id="idleIntro" aria-hidden="true" hidden></div>

    <footer class="footer">
      <p id="footerNote"></p>
      <p style="margin-top:4px;opacity:.8">
        LOTUS（CC0）骨架 ·
        <a href="https://doi.org/10.7554/eLife.70780" target="_blank" rel="noopener">论文</a>
        · 非用药建议
      </p>
    </footer>
  </div>
  <script>
    // 生产环境如“分子领养”服务不在同源 /api，可在这里指定完整地址：
    // window.ECO_CLAIM_ENDPOINT = "https://your-claim-server/api";
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
